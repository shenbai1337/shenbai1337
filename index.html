<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神白 · 个人名片</title>

<!-- 提前应用主题，避免刷新闪屏 -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia &&
                 window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {}
  })();
</script>

<style>
  /* ========== 注册可过渡的颜色变量（柔和渐变的关键） ========== */
  @property --bg-1        { syntax: '<color>'; inherits: true; initial-value: #1e1b4b; }
  @property --bg-2        { syntax: '<color>'; inherits: true; initial-value: #312e81; }
  @property --bg-3        { syntax: '<color>'; inherits: true; initial-value: #0f172a; }
  @property --accent-1    { syntax: '<color>'; inherits: true; initial-value: #818cf8; }
  @property --accent-2    { syntax: '<color>'; inherits: true; initial-value: #22d3ee; }
  @property --text        { syntax: '<color>'; inherits: true; initial-value: #e2e8f0; }
  @property --text-dim    { syntax: '<color>'; inherits: true; initial-value: #94a3b8; }
  @property --card-bg     { syntax: '<color>'; inherits: true; initial-value: rgba(255,255,255,0.07); }
  @property --card-border { syntax: '<color>'; inherits: true; initial-value: rgba(255,255,255,0.14); }
  @property --tag-bg      { syntax: '<color>'; inherits: true; initial-value: rgba(129,140,248,0.12); }
  @property --tag-border  { syntax: '<color>'; inherits: true; initial-value: rgba(129,140,248,0.3); }
  @property --tag-text    { syntax: '<color>'; inherits: true; initial-value: #c7d2fe; }
  @property --tag-hover-bg{ syntax: '<color>'; inherits: true; initial-value: rgba(129,140,248,0.25); }
  @property --toggle-bg   { syntax: '<color>'; inherits: true; initial-value: rgba(255,255,255,0.08); }
  @property --toggle-border{ syntax: '<color>'; inherits: true; initial-value: rgba(255,255,255,0.16); }
  @property --social-bg   { syntax: '<color>'; inherits: true; initial-value: rgba(255,255,255,0.06); }
  @property --social-border{ syntax: '<color>'; inherits: true; initial-value: rgba(255,255,255,0.14); }
  @property --glow-1      { syntax: '<color>'; inherits: true; initial-value: #818cf8; }
  @property --glow-2      { syntax: '<color>'; inherits: true; initial-value: #22d3ee; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ========== 深色主题（默认） ========== */
  :root,
  :root[data-theme="dark"] {
    --bg-1: #1e1b4b;
    --bg-2: #312e81;
    --bg-3: #0f172a;
    --accent-1: #818cf8;
    --accent-2: #22d3ee;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --card-bg: rgba(255, 255, 255, 0.07);
    --card-border: rgba(255, 255, 255, 0.14);
    --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.45),
                   inset 0 1px 0 rgba(255, 255, 255, 0.12);
    --tag-bg: rgba(129, 140, 248, 0.12);
    --tag-border: rgba(129, 140, 248, 0.3);
    --tag-text: #c7d2fe;
    --tag-hover-bg: rgba(129, 140, 248, 0.25);
    --toggle-bg: rgba(255, 255, 255, 0.08);
    --toggle-border: rgba(255, 255, 255, 0.16);
    --social-bg: rgba(255, 255, 255, 0.06);
    --social-border: rgba(255, 255, 255, 0.14);
    --glow-1: #818cf8;
    --glow-2: #22d3ee;
    --glow-opacity: 0.5;

    /* 主题变量过渡：柔和渐变 0.7s */
    transition:
      --bg-1 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --bg-2 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --bg-3 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --accent-1 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --accent-2 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --text 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --text-dim 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --card-bg 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --card-border 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --tag-bg 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --tag-border 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --tag-text 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --tag-hover-bg 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --toggle-bg 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --toggle-border 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --social-bg 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --social-border 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --glow-1 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --glow-2 0.7s cubic-bezier(0.4, 0, 0.2, 1),
      --glow-opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ========== 浅色主题 ========== */
  :root[data-theme="light"] {
    --bg-1: #eef2ff;
    --bg-2: #e0e7ff;
    --bg-3: #f8fafc;
    --accent-1: #6366f1;
    --accent-2: #0891b2;
    --text: #1e293b;
    --text-dim: #64748b;
    --card-bg: rgba(255, 255, 255, 0.7);
    --card-border: rgba(255, 255, 255, 0.9);
    --card-shadow: 0 24px 60px rgba(99, 102, 241, 0.18),
                   inset 0 1px 0 rgba(255, 255, 255, 0.8);
    --tag-bg: rgba(99, 102, 241, 0.1);
    --tag-border: rgba(99, 102, 241, 0.25);
    --tag-text: #4338ca;
    --tag-hover-bg: rgba(99, 102, 241, 0.18);
    --toggle-bg: rgba(255, 255, 255, 0.75);
    --toggle-border: rgba(15, 23, 42, 0.1);
    --social-bg: rgba(255, 255, 255, 0.65);
    --social-border: rgba(15, 23, 42, 0.08);
    --glow-1: #c7d2fe;
    --glow-2: #a5f3fc;
    --glow-opacity: 0.65;
  }

  html {
    background: var(--bg-3);
    transition: background-color 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
    background-size: 200% 200%;
    animation: bgShift 18s ease infinite;
    position: relative;
    overflow-x: hidden;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* 背景光斑，颜色跟随主题过渡 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: var(--glow-opacity);
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body::before {
    width: 380px; height: 380px;
    background: var(--glow-1);
    top: -120px; left: -120px;
    animation: float1 14s ease-in-out infinite;
  }
  body::after {
    width: 420px; height: 420px;
    background: var(--glow-2);
    bottom: -150px; right: -140px;
    animation: float2 16s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(60px, 40px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-70px, -50px); }
  }

  /* ========== 主题切换按钮 ========== */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    cursor: pointer;
    background: var(--toggle-bg);
    border: 1px solid var(--toggle-border);
    color: var(--text);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    z-index: 10;
    transition: transform 0.25s,
                background 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .theme-toggle:hover { transform: rotate(12deg) scale(1.08); }
  .theme-toggle:active { transform: scale(0.94); }

  .theme-toggle .icon {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 20px;
    height: 20px;
    transition: opacity 0.35s, transform 0.5s;
  }
  .theme-toggle .icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.5); }
  .theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
  :root[data-theme="light"] .theme-toggle .icon-sun  { opacity: 1; transform: rotate(0) scale(1); }
  :root[data-theme="light"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); }

  /* ========== 名片卡片 ========== */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 44px 32px 36px;
    border-radius: 24px;
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    animation: cardIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: background 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(28px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 头像 */
  .avatar {
    width: 104px;
    height: 104px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1),
                0 12px 30px rgba(129, 140, 248, 0.45);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(255,255,255,0.10), 0 12px 30px rgba(129,140,248,0.45); }
    50%      { box-shadow: 0 0 0 10px rgba(255,255,255,0.05), 0 12px 40px rgba(34,211,238,0.55); }
  }

  /* 名字 */
  .name {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-1));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }

  .tagline {
    margin-top: 10px;
    font-size: 0.95rem;
    color: var(--text-dim);
    line-height: 1.7;
    transition: color 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .divider {
    width: 56px;
    height: 3px;
    margin: 26px auto;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
  }

  /* 技能标签 */
  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .tag {
    padding: 6px 14px;
    font-size: 0.82rem;
    color: var(--tag-text);
    border-radius: 999px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    transition: transform 0.25s,
                background 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tag:hover {
    transform: translateY(-2px);
    background: var(--tag-hover-bg);
  }

  /* ========== 社交图标 ========== */
  .social {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 30px;
  }
  .social-link {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--text);
    background: var(--social-bg);
    border: 1px solid var(--social-border);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                background 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.25s;
  }
  .social-link svg { width: 26px; height: 26px; }
  .social-link:hover {
    transform: translateY(-4px) scale(1.06);
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 10px 22px rgba(99, 102, 241, 0.35);
  }
  .social-link:focus-visible {
    outline: 2px solid var(--accent-1);
    outline-offset: 3px;
  }

  .footer {
    margin-top: 28px;
    font-size: 0.75rem;
    color: var(--text-dim);
    opacity: 0.8;
    letter-spacing: 0.5px;
    transition: color 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* 响应式 */
  @media (max-width: 420px) {
    .card { padding: 36px 22px 30px; }
    .name { font-size: 1.65rem; }
    .avatar { width: 88px; height: 88px; font-size: 36px; }
    .social { gap: 14px; }
    .social-link { width: 48px; height: 48px; }
    .social-link svg { width: 23px; height: 23px; }
    .theme-toggle { top: 14px; right: 14px; width: 42px; height: 42px; }
  }
</style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41
               M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <main class="card">
    <div class="avatar">神</div>

    <h1 class="name">神白</h1>
    <p class="tagline">你好，我是神白。<br>热爱折腾各种有趣的小东西。</p>

    <div class="divider"></div>

    <div class="tags">
      <span class="tag">Web 开发</span>
      <span class="tag">设计</span>
      <span class="tag">开源</span>
      <span class="tag">摄影</span>
    </div>

    <!-- 仅保留 Bilibili 和 QQ -->
    <div class="social">
      <!-- 哔哩哔哩：点击进入个人主页 -->
      <a class="social-link"
         href="https://space.bilibili.com/你的UID"
         target="_blank" rel="noopener"
         aria-label="哔哩哔哩个人主页" title="哔哩哔哩个人主页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="7" width="18" height="13" rx="3.5"/>
          <path d="M7.5 3.8 10 7M16.5 3.8 14 7"/>
          <circle cx="9.5" cy="13.2" r="1.15" fill="currentColor" stroke="none"/>
          <circle cx="14.5" cy="13.2" r="1.15" fill="currentColor" stroke="none"/>
          <path d="M9 16.3c.9.65 2 1 3 1s2.1-.35 3-1"/>
        </svg>
      </a>

      <!-- QQ：点击添加好友 -->
      <a class="social-link"
         href="https://wpa.qq.com/msgrd?v=3&uin=你的QQ号&site=qq&menu=yes"
         target="_blank" rel="noopener"
         aria-label="添加我的 QQ 好友" title="添加我的 QQ 好友">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- 企鹅轮廓 -->
          <path d="M12 2.4c-3.4 0-5.9 2.7-5.9 6 0 1.1.3 2.1.8 3.1
                   -.9 1.4-2.3 3.7-2.7 5.4-.2.9.1 1.5.7 1.5.5 0 1-.5 1.4-1.3
                   .4 1.2 1 2.1 1.8 2.7-.3.4-.5.8-.5 1.2 0 .9.9 1.5 2.2 1.5
                   .8 0 1.5-.3 2.2-.8.7.5 1.4.8 2.2.8 1.3 0 2.2-.6 2.2-1.5
                   0-.4-.2-.8-.5-1.2.8-.6 1.4-1.5 1.8-2.7.4.8.9 1.3 1.4 1.3
                   .6 0 .9-.6.7-1.5-.4-1.7-1.8-4-2.7-5.4.5-1 .8-2 .8-3.1
                   0-3.3-2.5-6-5.9-6z"/>
          <!-- 眼睛 -->
          <circle cx="9.9" cy="8.2" r="0.85" fill="currentColor" stroke="none"/>
          <circle cx="14.1" cy="8.2" r="0.85" fill="currentColor" stroke="none"/>
          <!-- 喙 -->
          <path d="M10.8 10.6h2.4"/>
        </svg>
      </a>
    </div>

    <p class="footer">© 2026 神白 · Powered by GitHub Pages</p>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>

</body>
</html>
