<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神白 · 个人名片</title>
<style>
  /* ========== 基础重置 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1: #1e1b4b;
    --bg-2: #312e81;
    --bg-3: #0f172a;
    --accent-1: #818cf8;
    --accent-2: #22d3ee;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
    background-size: 200% 200%;
    animation: bgShift 18s ease infinite;
    overflow: hidden;
    position: relative;
  }

  /* 背景缓慢流动 */
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* 背景光斑 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 380px; height: 380px;
    background: var(--accent-1);
    top: -120px; left: -120px;
    animation: float1 14s ease-in-out infinite;
  }
  body::after {
    width: 420px; height: 420px;
    background: var(--accent-2);
    bottom: -150px; right: -140px;
    animation: float2 16s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(60px, 40px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-70px, -50px); }
  }

  /* ========== 名片卡片 ========== */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 44px 32px 36px;
    border-radius: 24px;
    text-align: center;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    animation: cardIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(28px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 头像 */
  .avatar {
    width: 104px;
    height: 104px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1),
                0 12px 30px rgba(129, 140, 248, 0.45);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(255,255,255,0.10), 0 12px 30px rgba(129,140,248,0.45); }
    50%      { box-shadow: 0 0 0 10px rgba(255,255,255,0.05), 0 12px 40px rgba(34,211,238,0.55); }
  }

  /* 名字 */
  .name {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #a5b4fc, #22d3ee, #a5b4fc);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }

  /* 一句话简介 */
  .tagline {
    margin-top: 10px;
    font-size: 0.95rem;
    color: var(--text-dim);
    line-height: 1.7;
  }

  /* 分隔线 */
  .divider {
    width: 56px;
    height: 3px;
    margin: 26px auto;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
  }

  /* 技能标签 */
  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .tag {
    padding: 6px 14px;
    font-size: 0.82rem;
    color: #c7d2fe;
    border-radius: 999px;
    background: rgba(129, 140, 248, 0.12);
    border: 1px solid rgba(129, 140, 248, 0.3);
    transition: transform 0.25s, background 0.25s;
  }
  .tag:hover {
    transform: translateY(-2px);
    background: rgba(129, 140, 248, 0.25);
  }

  /* 按钮组 */
  .actions {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 32px;
  }
  .btn {
    flex: 1;
    max-width: 150px;
    padding: 12px 0;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(34, 211, 238, 0.45);
  }
  .btn.ghost {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: none;
  }
  .btn.ghost:hover {
    background: rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
  }

  /* 页脚 */
  .footer {
    margin-top: 28px;
    font-size: 0.75rem;
    color: rgba(148, 163, 184, 0.7);
    letter-spacing: 0.5px;
  }

  /* 响应式 */
  @media (max-width: 420px) {
    .card { padding: 36px 22px 30px; }
    .name { font-size: 1.65rem; }
    .avatar { width: 88px; height: 88px; font-size: 36px; }
    .actions { flex-direction: column; align-items: center; }
    .btn { width: 100%; max-width: 100%; }
  }
</style>
</head>
<body>

  <main class="card">
    <!-- 头像：把「神」换成首字母，或换成 <img src="头像地址" alt="头像"> -->
    <div class="avatar">神</div>

    <h1 class="name">神白</h1>
    <p class="tagline">你好，我是神白。<br>热爱折腾各种有趣的小东西。</p>

    <div class="divider"></div>

    <!-- 技能 / 兴趣标签，随便改 -->
    <div class="tags">
      <span class="tag">Web 开发</span>
      <span class="tag">设计</span>
      <span class="tag">开源</span>
      <span class="tag">摄影</span>
    </div>

    <!-- 按钮：把 # 换成你的真实链接 -->
    <div class="actions">
      <a class="btn" href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
      <a class="btn ghost" href="mailto:you@example.com">联系我</a>
    </div>

    <p class="footer">© 2026 神白 · Powered by GitHub Pages</p>
  </main>

</body>
</html>
